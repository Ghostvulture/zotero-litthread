name: 缺陷反馈
description: 报告 LitThread · 研脉中可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请尽量使用公开或合成文献复现。不要上传 API Key、私有文献或真实研究资料；日志和截图请先脱敏。
  - type: input
    id: os
    attributes:
      label: 操作系统与版本
      description: 包括版本和 CPU 架构；界面问题请补充屏幕缩放比例。
      placeholder: Windows 11 / macOS / Linux 发行版、版本、架构
    validations:
      required: true
  - type: input
    id: zotero_version
    attributes:
      label: Zotero 完整版本
      placeholder: 例如 10.0.7
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 升级问题请同时填写升级前后的版本。
      placeholder: 例如 0.3.3，或 0.3.2 → 0.3.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 说明使用主窗口还是阅读标签页，以及文献或附件类型；无需提交私有原文。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 原本希望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么？是否每次都出现？如有错误提示，请提供脱敏文本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图（可选）
      description: 移除 Key、个人信息、私有文献内容和敏感路径。也可附公开或合成的最小样例。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除凭据和敏感信息，未提交私有文献或未授权的研究资料。
          required: true
